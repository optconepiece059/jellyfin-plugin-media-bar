name: Build MediaBar

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish src/Jellyfin.Plugin.MediaBar/Jellyfin.Plugin.MediaBar.csproj -c Release -o publish

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MediaBar
          path: publish
